name: deek-pm

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先执行初始化脚本生成 .env}
      POSTGRES_DB: deek-pm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deek -d deek-pm"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [deek-internal]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?请先执行初始化脚本生成 .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?请先执行初始化脚本生成 .env}
    ports:
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
    networks: [deek-internal]

  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3100
      DEPLOYMENT_MODE: selfhost
      INSTANCE_NAME: ${INSTANCE_NAME:-Deek PM Self-hosted}
      DATABASE_URL: postgresql://deek:${POSTGRES_PASSWORD}@postgres:5432/deek-pm
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?请先执行初始化脚本生成 .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?请先执行初始化脚本生成 .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?请先执行初始化脚本生成 .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ALLOW_REGISTRATION: "false"
    ports:
      - "${API_PORT:-3100}:3100"
    volumes:
      - managed-assets:/data/deek-pm
    networks: [deek-internal]

networks:
  deek-internal:
    driver: bridge

volumes:
  postgres-data:
  managed-assets:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
