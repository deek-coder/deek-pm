<!doctype html>
<html lang="zh-CN" data-theme="glass">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: deek-asset: http: https:; font-src 'self' data:; connect-src 'self' http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src 'none'" />
    <link rel="icon" type="image/png" href="/deek-logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deek PM</title>
    <script>
      try {
        var theme = localStorage.getItem('deek-pm.theme.v1')
        if (theme === 'glass' || theme === 'macos') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
